command: ['npm', 'run', 'start']
env:
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_VOLUME_FILES
    valueFrom: files
  - name: DATABRICKS_JOB_ID
    valueFrom: job
  - name: IMAGE_EXTRACTION_ENDPOINT
    valueFrom: image-extraction-endpoint
  - name: CONFIG_ADMIN_PRINCIPALS
    valueFrom: config-admin-principals
  - name: CONFIG_DESTINATION_ALLOWLIST
    valueFrom: config-destination-allowlist
  - name: DATABRICKS_GENIE_SPACE_ID
    valueFrom: genie-space
  - name: COWORKER_FM_ENDPOINT
    valueFrom: coworker-fm-endpoint
