bundle:
  name: genie-automations

variables:
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  uploads_volume_full_name:
    description: Three-level name of the existing Unity Catalog Volume used for immutable uploads and parse previews.
    default: felix_demo_catalog.genie-automations.raw_uploads
  config_secret_scope:
    description: Databricks secret scope containing deploy-time runtime configuration.
    default: genie-automations-config
  config_admin_principals_secret_key:
    description: Secret key containing comma-separated trusted user/group principals allowed to govern config.
    default: admin-principals
  config_destination_allowlist_secret_key:
    description: Secret key containing comma-separated fully-qualified deployment-approved destinations.
    default: destination-allowlist
  projection_warehouse_id:
    description: Serverless or Pro SQL warehouse used to create the governed projection view.
    default: f7cdb11888c4799e
  projection_postgres_endpoint:
    description: Lakebase endpoint resource read by the projection publisher.
    default: projects/genie-automations/branches/production/endpoints/primary
  projection_postgres_database_name:
    description: PostgreSQL database name read by the projection publisher.
    default: databricks_postgres
  projection_publisher_sp:
    description: Dedicated service principal application ID that runs the projection publisher. Required; do not use the app service principal.
  chase_scheduler_sp:
    description: Dedicated service principal application ID that runs scheduled chase evaluation. Its Lakebase role receives only EXECUTE on the 004 scheduler functions.
  chase_scheduler_cron:
    description: Quartz cron expression for chase evaluation.
    default: '0 0 * * * ?'
  chase_notification_destination_id:
    description: Existing Databricks EMAIL notification destination ID for approved chase digests.
  chase_alert_warehouse_id:
    description: SQL warehouse used by the approved chase reminder alert.
    default: f7cdb11888c4799e
  chase_alert_run_as_sp:
    description: Dedicated service principal application ID used by both the chase projection and alert.
  chase_alert_cron:
    description: Daily UTC SQL Alert evaluation schedule; keep it after the projection schedule.
    default: '0 15 8 * * ?'
  genie_space_id:
    description: Existing curated receivables Genie Space ID. Supply this bundle variable at deploy time.
  coworker_fm_endpoint:
    description: Existing Model Serving endpoint used by the reconciliation co-worker.
    default: databricks-claude-sonnet-4-6

resources:
  apps:
    app:
      name: 'genie-automations'
      description: 'Genie-automations reconciliation co-worker (AppKit/DuBois, OBO)'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # OBO: run Lakebase queries AS THE CALLING USER (session_user = the human).
      # This is the ADR-006 Option A gate. 'postgres' = per-user Lakebase pool;
      # 'serving.serving-endpoints' lets the agent call the FM.
      user_api_scopes:
        - postgres
        - serving.serving-endpoints
        - files.files
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: files
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.uploads_volume_full_name}
            permission: WRITE_VOLUME
        - name: job
          job:
            id: ${resources.jobs.parse_preview.id}
            permission: CAN_MANAGE_RUN
        - name: image-extraction-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY
        - name: coworker-fm-endpoint
          serving_endpoint:
            name: ${var.coworker_fm_endpoint}
            permission: CAN_QUERY
        - name: config-admin-principals
          secret:
            scope: ${var.config_secret_scope}
            key: ${var.config_admin_principals_secret_key}
            permission: READ
        - name: config-destination-allowlist
          secret:
            scope: ${var.config_secret_scope}
            key: ${var.config_destination_allowlist_secret_key}
            permission: READ
        - name: genie-space
          genie_space:
            name: 'Receivables Collection — Ask Data'
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

  jobs:
    parse_preview:
      name: '[${bundle.target}] genie-automations-parse-preview'
      tasks:
        - task_key: parse_preview
          spark_python_task:
            python_file: ./ingest_job/runner.py
          environment_key: parser
      environments:
        - environment_key: parser
          spec:
            client: '4'
            dependencies:
              - openpyxl

    publish_receivables_projection:
      name: '[${bundle.target}] genie-automations-publish-receivables-projection'
      description: Publishes a governed Lakebase receivables snapshot and its read-only Genie view.
      run_as:
        service_principal_name: ${var.projection_publisher_sp}
      schedule:
        quartz_cron_expression: '0 0/5 * * * ?'
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: publish_delta_snapshot
          spark_python_task:
            python_file: ./projection/publish.py
            parameters:
              - --endpoint
              - ${var.projection_postgres_endpoint}
              - --database
              - ${var.projection_postgres_database_name}
          environment_key: projection
        - task_key: create_projection_view
          depends_on:
            - task_key: publish_delta_snapshot
          notebook_task:
            notebook_path: ./projection/sql/create_receivables_projection.sql
            source: WORKSPACE
            warehouse_id: ${var.projection_warehouse_id}
      environments:
        - environment_key: projection
          spec:
            client: '4'
            dependencies:
              - databricks-sdk==0.81.0
              - psycopg[binary]==3.2.10

    chase_scheduler:
      name: '[${bundle.target}] genie-automations-chase-scheduler'
      description: Evaluates chase reminders into a pending outbox; the transport is intentionally no-op.
      run_as:
        service_principal_name: ${var.chase_scheduler_sp}
      # Enabled after provisioning and end-to-end verification on 2026-09-25.
      schedule:
        quartz_cron_expression: ${var.chase_scheduler_cron}
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: evaluate_chase_reminders
          spark_python_task:
            python_file: ./chase_scheduler/scheduler.py
            parameters:
              - --endpoint
              - ${var.projection_postgres_endpoint}
              - --database
              - ${var.projection_postgres_database_name}
          environment_key: chase_scheduler
      environments:
        - environment_key: chase_scheduler
          spec:
            client: '4'
            dependencies:
              - databricks-sdk==0.81.0
              - psycopg[binary]==3.2.10

    publish_approved_chase_reminders:
      name: '[${bundle.target}] genie-automations-publish-approved-chase-reminders'
      description: Snapshots approved eligible reminders for the native email digest and marks them announced.
      run_as:
        service_principal_name: ${var.chase_alert_run_as_sp}
      # Enabled after provisioning and end-to-end verification on 2026-09-25.
      schedule:
        quartz_cron_expression: '0 0 8 * * ?'
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: publish_approved_chase_snapshot
          spark_python_task:
            python_file: ./projection/publish_chase.py
            parameters:
              - --endpoint
              - ${var.projection_postgres_endpoint}
              - --database
              - ${var.projection_postgres_database_name}
          environment_key: chase_projection
        - task_key: create_approved_chase_view
          depends_on:
            - task_key: publish_approved_chase_snapshot
          notebook_task:
            notebook_path: ./projection/sql/create_chase_projection.sql
            source: WORKSPACE
            warehouse_id: ${var.chase_alert_warehouse_id}
      environments:
        - environment_key: chase_projection
          spec:
            client: '4'
            dependencies:
              - databricks-sdk==0.81.0
              - psycopg[binary]==3.2.10

  alerts:
    approved_chase_digest:
      display_name: '[${bundle.target}] Approved chase reminder digest'
      custom_summary: '[{{ALERT_STATUS}}] {{ALERT_NAME}} — approved reminder digest'
      custom_description: |
        Human-approved internal reminders for this approval window:

        {{QUERY_RESULT_TABLE}}

        The email table includes at most 100 rows. Check overflow_count in the table; values above zero mean additional approved reminders are available in the approved_chase_reminders view.
      warehouse_id: ${var.chase_alert_warehouse_id}
      run_as:
        service_principal_name: ${var.chase_alert_run_as_sp}
      query_text: |
        SELECT
          task_name,
          owner_email,
          item_reference,
          due_at,
          concat(replace(offset_kind, '_', ' '), ' ', offset_days, ' day(s)') AS offset,
          count(*) OVER () AS reminder_count,
          greatest(count(*) OVER () - 100, 0) AS overflow_count
        FROM `felix_demo_catalog`.`genie-automations`.`approved_chase_reminders`
        ORDER BY due_at
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: reminder_count
          display: reminder_count
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: false
          retrigger_seconds: 0
          subscriptions:
            - destination_id: ${var.chase_notification_destination_id}
      # Enabled after provisioning and end-to-end verification on 2026-09-25.
      schedule:
        quartz_cron_schedule: ${var.chase_alert_cron}
        timezone_id: UTC
        pause_status: UNPAUSED

targets:
  default:
    default: true
    workspace:
      host: https://fevm-felix-demo.cloud.databricks.com

    variables:
      postgres_branch: projects/genie-automations/branches/production
      postgres_database: projects/genie-automations/branches/production/databases/databricks-postgres
      postgres_project: projects/genie-automations
