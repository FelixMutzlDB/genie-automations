bundle:
  name: genie-automations

variables:
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  uploads_volume_full_name:
    description: Three-level name of the existing Unity Catalog Volume used for immutable uploads and parse previews.
    default: felix_demo_catalog.genie-automations.raw_uploads
  config_secret_scope:
    description: Databricks secret scope containing deploy-time runtime configuration.
    default: genie-automations-config
  config_admin_principals_secret_key:
    description: Secret key containing comma-separated trusted user/group principals allowed to govern config.
    default: admin-principals
  config_destination_allowlist_secret_key:
    description: Secret key containing comma-separated fully-qualified deployment-approved destinations.
    default: destination-allowlist

resources:
  apps:
    app:
      name: 'genie-automations'
      description: 'Genie-automations reconciliation co-worker (AppKit/DuBois, OBO)'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # OBO: run Lakebase queries AS THE CALLING USER (session_user = the human).
      # This is the ADR-006 Option A gate. 'postgres' = per-user Lakebase pool;
      # 'serving.serving-endpoints' lets the agent call the FM.
      user_api_scopes:
        - postgres
        - serving.serving-endpoints
        - files.files

      # The resources which this app has access to.
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: files
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.uploads_volume_full_name}
            permission: WRITE_VOLUME
        - name: job
          job:
            id: ${resources.jobs.parse_preview.id}
            permission: CAN_MANAGE_RUN
        - name: image-extraction-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY
        - name: config-admin-principals
          secret:
            scope: ${var.config_secret_scope}
            key: ${var.config_admin_principals_secret_key}
            permission: READ
        - name: config-destination-allowlist
          secret:
            scope: ${var.config_secret_scope}
            key: ${var.config_destination_allowlist_secret_key}
            permission: READ

  jobs:
    parse_preview:
      name: '[${bundle.target}] genie-automations-parse-preview'
      tasks:
        - task_key: parse_preview
          spark_python_task:
            python_file: ./ingest_job/runner.py
          environment_key: parser
      environments:
        - environment_key: parser
          spec:
            client: '4'
            dependencies:
              - openpyxl

targets:
  default:
    default: true
    workspace:
      host: https://fevm-felix-demo.cloud.databricks.com

    variables:
      postgres_branch: projects/genie-automations/branches/production
      postgres_database: projects/genie-automations/branches/production/databases/databricks-postgres
      postgres_project: projects/genie-automations
